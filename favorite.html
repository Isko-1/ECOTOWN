<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Избранные — Карта волонтёров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --green-900:#0d3320;--green-800:#155232;--green-600:#1e8549;--green-500:#27ae60;
  --green-400:#2ecc71;--green-100:#e6f9f0;--green-50:#f4fbf7;
  --ink:#0f1f15;--ink-mid:#3d5c4a;--ink-light:#7a9e89;
  --border:#d4e6db;--surface:#fff;--bg:#f0f7f2;
  --red:#e53935;--orange:#f57c00;--gold:#f59f0a;--blue:#1976d2;
  --radius-lg:18px;--radius-md:12px;--radius-sm:8px;
  --shadow-sm:0 2px 8px rgba(15,31,21,.07);--shadow-md:0 6px 24px rgba(15,31,21,.10);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

/* WELCOME */
#welcome-screen{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,var(--green-900),var(--green-800) 50%,#1a6e3c);display:flex;align-items:center;justify-content:center;}
#welcome-screen.hidden{display:none;}
.welcome-card{background:var(--surface);border-radius:24px;padding:44px 40px;width:400px;max-width:92vw;box-shadow:0 40px 100px rgba(0,0,0,.4);text-align:center;animation:cardIn .5s cubic-bezier(.16,1,.3,1);}
@keyframes cardIn{from{transform:translateY(24px) scale(.95);opacity:0;}to{transform:none;opacity:1;}}
.welcome-logo{width:64px;height:64px;background:linear-gradient(135deg,var(--gold),var(--orange));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;box-shadow:0 8px 24px rgba(245,159,10,.3);}
.welcome-title{font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;margin-bottom:8px;}
.welcome-sub{font-size:13px;color:var(--ink-mid);margin-bottom:24px;line-height:1.6;}
.welcome-input{width:100%;border:2px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;font-size:16px;outline:none;font-family:'Manrope',sans-serif;text-align:center;transition:border-color .2s;}
.welcome-input:focus{border-color:var(--green-600);}
.welcome-input.error{border-color:var(--red);}
.welcome-btn{width:100%;margin-top:16px;padding:13px;border-radius:var(--radius-md);border:none;background:linear-gradient(135deg,var(--gold),var(--orange));color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 16px rgba(245,159,10,.35);}
.welcome-btn:hover{transform:translateY(-2px);}

/* LAYOUT */
#app{display:none;}
.page-wrap{max-width:900px;margin:0 auto;padding:28px 20px 48px;}

.page-header{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);padding:20px 28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.header-left{display:flex;align-items:center;gap:14px;}
.header-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--gold),var(--orange));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(245,159,10,.3);flex-shrink:0;}
.header-title{font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;}
.header-sub{font-size:12px;color:var(--ink-light);margin-top:3px;}
.count-badge{display:inline-flex;align-items:center;background:var(--green-100);color:var(--green-600);border-radius:30px;padding:4px 14px;font-size:13px;font-weight:800;border:1px solid var(--border);}
.user-badge{display:inline-flex;align-items:center;gap:7px;background:var(--green-50);border:1.5px solid var(--border);border-radius:30px;padding:5px 14px 5px 5px;font-size:13px;font-weight:700;}
.user-av-sm{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--green-600),var(--green-400));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--green-600),var(--green-500));color:#fff;padding:11px 20px;border-radius:var(--radius-md);text-decoration:none;font-weight:800;font-size:13px;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 12px rgba(30,133,73,.28);white-space:nowrap;}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,133,73,.38);}
.switch-btn{background:var(--surface);color:var(--ink-mid);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;white-space:nowrap;}
.switch-btn:hover{background:var(--border);}

.filters-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-sm);}
.filter-label{font-size:11px;font-weight:800;color:var(--ink-light);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
.filter-select{padding:7px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--ink);outline:none;background:var(--bg);font-family:'Manrope',sans-serif;cursor:pointer;}
.search-input{flex:1;min-width:160px;padding:7px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:12px;color:var(--ink);outline:none;background:var(--surface);font-family:'Manrope',sans-serif;}
.search-input:focus,.filter-select:focus{border-color:var(--green-600);}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
.card{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;animation:fadeUp .35s ease both;}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.card-top{padding:18px 20px 14px;border-bottom:1px solid var(--border);position:relative;}
.card-fav-star{position:absolute;top:16px;right:18px;font-size:20px;color:var(--gold);cursor:pointer;background:none;border:none;transition:transform .15s;}
.card-fav-star:hover{transform:scale(1.25);}
.card-name{font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;margin-bottom:10px;padding-right:36px;line-height:1.3;}
.card-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.badge{display:inline-block;padding:3px 11px;border-radius:30px;font-size:11px;font-weight:800;}
.badge-red{background:#fde8e6;color:#d32e22;}.badge-orange{background:#fff3e0;color:#e07b00;}.badge-green{background:#e6f9f0;color:#1a7a4a;}
.badge-diff{background:var(--bg);color:var(--ink-mid);border:1px solid var(--border);}
.badge-vol{background:var(--green-50);color:var(--green-600);border:1px solid var(--green-100);}
.card-desc{font-size:13px;line-height:1.55;color:var(--ink-mid);font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

.card-meta{padding:10px 20px;background:var(--green-50);border-bottom:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;}
.meta-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-mid);}

.card-photos{padding:12px 20px;display:flex;gap:10px;border-bottom:1px solid var(--border);}
.photo-col{flex:1;display:flex;flex-direction:column;gap:5px;}
.photo-label-sm{font-size:10px;font-weight:800;color:var(--ink-light);text-transform:uppercase;letter-spacing:.07em;}
.photo-img{width:100%;height:90px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);}
.photo-empty{width:100%;height:90px;border-radius:var(--radius-sm);border:1.5px dashed var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--ink-light);}

.card-actions{padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;}
.btn{flex:1;min-width:100px;padding:10px 14px;border-radius:var(--radius-md);border:none;font-size:12px;font-weight:800;cursor:pointer;font-family:'Manrope',sans-serif;transition:transform .15s;}
.btn-goto{background:linear-gradient(135deg,var(--blue),#42a5f5);color:#fff;box-shadow:0 3px 10px rgba(25,118,210,.25);}
.btn-goto:hover{transform:translateY(-1px);}
.btn-remove{background:#fde8e6;color:#d32e22;border:1.5px solid #fbc8c4;}
.btn-remove:hover{background:#fbc8c4;}

.empty-state{background:var(--surface);border-radius:var(--radius-lg);border:1.5px dashed var(--border);padding:60px 40px;text-align:center;grid-column:1/-1;}
.empty-icon{font-size:56px;margin-bottom:16px;display:block;opacity:.7;}
.empty-title{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--ink-light);margin-bottom:24px;line-height:1.6;}
.empty-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--green-600),var(--green-500));color:#fff;padding:12px 24px;border-radius:var(--radius-md);text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(30,133,73,.3);}
.empty-btn:hover{transform:translateY(-2px);}

#loading{text-align:center;padding:60px;color:var(--ink-light);font-weight:600;font-size:15px;grid-column:1/-1;}
.stars{color:var(--gold);font-size:13px;}.stars .off{color:var(--border);}

@media(max-width:600px){.page-wrap{padding:14px 12px 32px;}.cards-grid{grid-template-columns:1fr;}.header-right{gap:8px;}}
</style>
</head>
<body>

<!-- Экран входа -->
<div id="welcome-screen">
  <div class="welcome-card">
    <div class="welcome-logo">⭐</div>
    <div class="welcome-title">Избранные метки</div>
    <div class="welcome-sub">Введите имя, чтобы увидеть свои избранные места</div>
    <input id="welcome-input" class="welcome-input" placeholder="Например: Айгерим" maxlength="30" autocomplete="off"/>
    <button class="welcome-btn" onclick="enterFavs()">Посмотреть избранное →</button>
  </div>
</div>

<div id="app">
  <div class="page-wrap">
    <div class="page-header">
      <div class="header-left">
        <div class="header-icon">⭐</div>
        <div>
          <div class="header-title">Избранные метки</div>
          <div class="header-sub">Сохранённые места уборки</div>
        </div>
        <span class="count-badge" id="count-badge">0 меток</span>
      </div>
      <div class="header-right">
        <div class="user-badge">
          <div class="user-av-sm" id="user-av">?</div>
          <span id="user-name-display">...</span>
        </div>
        <button class="switch-btn" onclick="switchUser()">↩ Сменить</button>
        <a href="./index.html" class="back-btn">← Назад к карте</a>
      </div>
    </div>

    <div class="filters-bar">
      <span class="filter-label">Фильтры:</span>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию..."/>
      <select class="filter-select" id="filterStatus">
        <option value="all">Все статусы</option>
        <option value="новая">🔴 Новая</option>
        <option value="в работе">🟠 В работе</option>
        <option value="выполнена">✅ Выполнена</option>
      </select>
      <select class="filter-select" id="filterDiff">
        <option value="all">Вся сложность</option>
        <option value="1">★ Очень легко</option>
        <option value="2">★★ Легко</option>
        <option value="3">★★★ Средне</option>
        <option value="4">★★★★ Сложно</option>
        <option value="5">★★★★★ Очень сложно</option>
      </select>
    </div>

    <div class="cards-grid" id="list">
      <div id="loading">⏳ Загрузка избранного...</div>
    </div>
  </div>
</div>

<script>
firebase.initializeApp({ databaseURL: "https://ecotown-e0a36-default-rtdb.firebaseio.com/" });
var db = firebase.database();

var _username = '';
var _allMarks = {};   // firebaseKey -> mark
var _myFavKeys = {};  // firebaseKey -> true

function getUsername(){ return _username; }

function userKey(name){ return name.replace(/[^a-zA-Z0-9_]/g,'_'); }
function favsRef(name){ return db.ref('users/'+userKey(name)+'/favorites'); }

function enterFavs(){
  var val = document.getElementById('welcome-input').value.trim();
  if(!val){
    document.getElementById('welcome-input').style.borderColor='#e53935';
    setTimeout(function(){ document.getElementById('welcome-input').style.borderColor=''; },400);
    return;
  }
  _username = val;
  document.getElementById('welcome-screen').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-av').textContent = val.charAt(0).toUpperCase();
  document.getElementById('user-name-display').textContent = val;
  loadData();
}

function switchUser(){
  _username = '';
  _myFavKeys = {};
  _allMarks = {};
  db.ref('marks').off();
  favsRef(_username).off();
  document.getElementById('welcome-input').value = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('welcome-screen').classList.remove('hidden');
}

function loadData(){
  // Слушаем все метки
  db.ref('marks').on('value', function(snap){
    _allMarks = snap.val() || {};
    render();
  });
  // Слушаем избранное текущего пользователя
  favsRef(_username).on('value', function(snap){
    _myFavKeys = snap.val() || {};
    render();
  });
}

function removeFav(firebaseKey){
  favsRef(_username).child(firebaseKey).remove();
  // Обновление придёт через on('value')
}

function goToMap(lat, lng){
  window.location.href = './index.html?lat='+lat+'&lng='+lng;
}

function badgeHtml(status){
  if(status==='новая')    return '<span class="badge badge-red">🔴 Новая</span>';
  if(status==='в работе') return '<span class="badge badge-orange">🟠 В работе</span>';
  return '<span class="badge badge-green">✅ Выполнена</span>';
}

function starsHtml(n){
  var s='<span class="stars">';
  for(var i=1;i<=5;i++) s+='<span class="'+(i<=n?'':'off')+'">★</span>';
  return s+'</span>';
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function plural(n, one, few, many){
  var m=Math.abs(n)%100, m1=m%10;
  if(m>10&&m<20) return many;
  if(m1>1&&m1<5) return few;
  if(m1===1) return one;
  return many;
}

function render(){
  var search  = document.getElementById('searchInput').value.toLowerCase().trim();
  var stFilt  = document.getElementById('filterStatus').value;
  var dfFilt  = document.getElementById('filterDiff').value;
  var list    = document.getElementById('list');
  var badge   = document.getElementById('count-badge');

  var favKeys = Object.keys(_myFavKeys);
  badge.textContent = favKeys.length + ' ' + plural(favKeys.length,'метка','метки','меток');

  if(!favKeys.length){
    list.innerHTML='<div class="empty-state"><span class="empty-icon">⭐</span><div class="empty-title">Нет избранных меток</div><div class="empty-sub">Откройте карту, нажмите на метку<br>и добавьте её в избранное.</div><a href="./index.html" class="empty-btn">🗺️ Открыть карту</a></div>';
    return;
  }

  // Фильтрация
  var filtered = favKeys.reduce(function(acc, fkey){
    var m = _allMarks[fkey];
    if(!m) return acc; // метка удалена
    if(search && (m.name||'').toLowerCase().indexOf(search)===-1 && (m.desc||'').toLowerCase().indexOf(search)===-1) return acc;
    if(stFilt!=='all' && m.status!==stFilt) return acc;
    if(dfFilt!=='all' && String(m.diff)!==dfFilt) return acc;
    acc.push({key:fkey, mark:m});
    return acc;
  },[]);

  if(!filtered.length){
    list.innerHTML='<div class="empty-state"><span class="empty-icon">🔍</span><div class="empty-title">Ничего не найдено</div><div class="empty-sub">Попробуйте изменить фильтры.</div></div>';
    return;
  }

  var html = '';
  filtered.forEach(function(item, idx){
    var m = item.mark, fkey = item.key;
    var delay = (idx*0.05).toFixed(2)+'s';
    var hasBefore = m.before && m.before.length>10;
    var hasAfter  = m.after  && m.after.length>10;
    var showPhotos = hasBefore||hasAfter;
    var diffLabels=['','Очень легко','Легко','Средне','Сложно','Очень сложно'];

    html+='<div class="card" style="animation-delay:'+delay+'">'
      +'<div class="card-top">'
      +'<button class="card-fav-star" onclick="removeFav(\''+fkey+'\')" title="Убрать из избранного">⭐</button>'
      +'<div class="card-name">'+escHtml(m.name)+'</div>'
      +'<div class="card-badges">'+badgeHtml(m.status)
      +(m.diff?'<span class="badge badge-diff">'+starsHtml(m.diff)+'</span>':'')
      +((m.vol||0)>0?'<span class="badge badge-vol">🙋 '+(m.vol||0)+' вол.</span>':'')
      +'</div>'
      +'<div class="card-desc">'+escHtml(m.desc)+'</div>'
      +'</div>'

      +'<div class="card-meta">'
      +(m.author?'<div class="meta-item">👤 '+escHtml(m.author)+'</div>':'')
      +(m.diff?'<div class="meta-item">💪 '+escHtml(diffLabels[m.diff]||'')+'</div>':'')
      +'<div class="meta-item">📍 '+escHtml((m.lat||0).toFixed(4))+', '+escHtml((m.lng||0).toFixed(4))+'</div>'
      +'</div>';

    if(showPhotos){
      html+='<div class="card-photos">'
        +'<div class="photo-col"><div class="photo-label-sm">До</div>'
        +(hasBefore?'<img class="photo-img" src="'+m.before+'" loading="lazy"/>':'<div class="photo-empty">Нет фото</div>')
        +'</div>'
        +'<div class="photo-col"><div class="photo-label-sm">После</div>'
        +(hasAfter?'<img class="photo-img" src="'+m.after+'" loading="lazy"/>':'<div class="photo-empty">Не добавлено</div>')
        +'</div></div>';
    }

    html+='<div class="card-actions">'
      +'<button class="btn btn-goto" onclick="goToMap('+m.lat+','+m.lng+')">📍 Перейти на карте</button>'
      +'<button class="btn btn-remove" onclick="removeFav(\''+fkey+'\')">✕ Удалить</button>'
      +'</div></div>';
  });

  list.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterStatus').addEventListener('change', render);
document.getElementById('filterDiff').addEventListener('change', render);
document.getElementById('welcome-input').addEventListener('keydown', function(e){ if(e.key==='Enter') enterFavs(); });
</script>
</body>
</html>
