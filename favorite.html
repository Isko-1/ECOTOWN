<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Избранные метки — Карта волонтёров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --green-900: #0d3320;
  --green-800: #155232;
  --green-600: #1e8549;
  --green-500: #27ae60;
  --green-400: #2ecc71;
  --green-100: #e6f9f0;
  --green-50:  #f4fbf7;
  --ink:       #0f1f15;
  --ink-mid:   #3d5c4a;
  --ink-light: #7a9e89;
  --border:    #d4e6db;
  --surface:   #ffffff;
  --bg:        #f0f7f2;
  --red:       #e53935;
  --orange:    #f57c00;
  --gold:      #f59f0a;
  --blue:      #1976d2;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 2px 8px rgba(15,31,21,0.07);
  --shadow-md: 0 6px 24px rgba(15,31,21,0.10);
  --shadow-lg: 0 16px 48px rgba(15,31,21,0.14);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Manrope', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}

/* ─── PAGE WRAP ───────────────────────── */
.page-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 20px 48px;
}

/* ─── HEADER ──────────────────────────── */
.page-header {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 20px 28px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-icon {
  width: 48px; height: 48px;
  background: linear-gradient(135deg, #f59f0a, #f57c00);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 14px rgba(245,159,10,0.3);
  flex-shrink: 0;
}

.header-title {
  font-family: 'Nunito', sans-serif;
  font-size: 22px;
  font-weight: 900;
  color: var(--ink);
}

.header-sub {
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 3px;
  font-weight: 500;
}

.count-badge {
  display: inline-flex;
  align-items: center;
  background: var(--green-100);
  color: var(--green-600);
  border-radius: 30px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 800;
  gap: 5px;
  font-family: 'Nunito', sans-serif;
  border: 1px solid var(--border);
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--green-600), var(--green-500));
  color: #fff;
  padding: 11px 20px;
  border-radius: var(--radius-md);
  text-decoration: none;
  font-weight: 800;
  font-size: 13px;
  font-family: 'Manrope', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 3px 12px rgba(30,133,73,0.28);
  white-space: nowrap;
}
.back-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(30,133,73,0.38);
}
.back-btn:active { transform: translateY(0); }

/* ─── FILTERS BAR ─────────────────────── */
.filters-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}

.filter-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--ink-light);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  white-space: nowrap;
}

.filter-select {
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  outline: none;
  background: var(--bg);
  font-family: 'Manrope', sans-serif;
  cursor: pointer;
  transition: border-color 0.15s;
}
.filter-select:focus { border-color: var(--green-600); }

.search-input {
  flex: 1;
  min-width: 160px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  outline: none;
  background: var(--surface);
  font-family: 'Manrope', sans-serif;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--green-600); }

/* ─── GRID ────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

/* ─── CARD ────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.35s ease both;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-top {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.card-fav-star {
  position: absolute;
  top: 16px; right: 18px;
  font-size: 20px;
  color: var(--gold);
  cursor: pointer;
  transition: transform 0.15s;
  background: none; border: none;
  line-height: 1;
}
.card-fav-star:hover { transform: scale(1.25); }

.card-name {
  font-family: 'Nunito', sans-serif;
  font-size: 17px;
  font-weight: 900;
  color: var(--ink);
  margin-bottom: 10px;
  padding-right: 36px;
  line-height: 1.3;
}

.card-badges {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 10px;
}

.badge {
  display: inline-block;
  padding: 3px 11px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
}
.badge-red    { background: #fde8e6; color: #d32e22; }
.badge-orange { background: #fff3e0; color: #e07b00; }
.badge-green  { background: #e6f9f0; color: #1a7a4a; }
.badge-diff   { background: var(--bg); color: var(--ink-mid); border: 1px solid var(--border); }
.badge-vol    { background: var(--green-50); color: var(--green-600); border: 1px solid var(--green-100); }

.card-desc {
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-mid);
  font-weight: 500;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ─── CARD META ──────────────────────── */
.card-meta {
  padding: 10px 20px;
  background: var(--green-50);
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-mid);
}

/* ─── CARD PHOTOS ─────────────────────── */
.card-photos {
  padding: 12px 20px;
  display: flex;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}

.photo-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.photo-label {
  font-size: 10px;
  font-weight: 800;
  color: var(--ink-light);
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.photo-img {
  width: 100%; height: 90px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

.photo-empty {
  width: 100%; height: 90px;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-light);
  text-align: center;
  padding: 8px;
}

/* ─── CARD ACTIONS ────────────────────── */
.card-actions {
  padding: 14px 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: auto;
}

.btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: none;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  font-family: 'Manrope', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  text-align: center;
}

.btn-goto {
  background: linear-gradient(135deg, var(--blue), #42a5f5);
  color: #fff;
  box-shadow: 0 3px 10px rgba(25,118,210,0.25);
}
.btn-goto:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 16px rgba(25,118,210,0.35);
}

.btn-remove {
  background: #fde8e6;
  color: #d32e22;
  border: 1.5px solid #fbc8c4;
}
.btn-remove:hover {
  background: #fbc8c4;
  transform: translateY(-1px);
}

/* ─── EMPTY STATE ─────────────────────── */
.empty-state {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1.5px dashed var(--border);
  padding: 60px 40px;
  text-align: center;
  animation: fadeUp 0.4s ease;
}

.empty-icon {
  font-size: 56px;
  margin-bottom: 16px;
  display: block;
  opacity: 0.7;
}

.empty-title {
  font-family: 'Nunito', sans-serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--ink);
  margin-bottom: 8px;
}

.empty-sub {
  font-size: 14px;
  color: var(--ink-light);
  margin-bottom: 24px;
  line-height: 1.6;
  font-weight: 500;
}

.empty-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--green-600), var(--green-500));
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-md);
  text-decoration: none;
  font-weight: 800;
  font-size: 14px;
  font-family: 'Manrope', sans-serif;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 14px rgba(30,133,73,0.3);
}
.empty-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 20px rgba(30,133,73,0.4);
}

/* ─── STARS ───────────────────────────── */
.stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
.stars .off { color: var(--border); }

/* ─── RESPONSIVE ──────────────────────── */
@media (max-width: 600px) {
  .page-wrap { padding: 14px 12px 32px; }
  .page-header { padding: 16px 18px; }
  .header-title { font-size: 18px; }
  .cards-grid { grid-template-columns: 1fr; }
  .card-actions { gap: 8px; }
}
</style>
</head>
<body>

<div class="page-wrap">

  <!-- HEADER -->
  <div class="page-header">
    <div class="header-left">
      <div class="header-icon">⭐</div>
      <div>
        <div class="header-title">Избранные метки</div>
        <div class="header-sub">Сохранённые места уборки</div>
      </div>
      <span class="count-badge" id="count-badge">0 меток</span>
    </div>
    <a href="./index.html" class="back-btn">← Назад к карте</a>
  </div>

  <!-- FILTERS -->
  <div class="filters-bar">
    <span class="filter-label">Фильтры:</span>
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по названию..."/>
    <select class="filter-select" id="filterStatus">
      <option value="all">Все статусы</option>
      <option value="новая">🔴 Новая</option>
      <option value="в работе">🟠 В работе</option>
      <option value="выполнена">✅ Выполнена</option>
    </select>
    <select class="filter-select" id="filterDiff">
      <option value="all">Вся сложность</option>
      <option value="1">★ Очень легко</option>
      <option value="2">★★ Легко</option>
      <option value="3">★★★ Средне</option>
      <option value="4">★★★★ Сложно</option>
      <option value="5">★★★★★ Очень сложно</option>
    </select>
  </div>

  <!-- CARDS -->
  <div class="cards-grid" id="list"></div>

</div>

<script>
// ─── DATA HELPERS ─────────────────────────────────────────
function getAllPoints(){
  var custom = [];
  try { custom = JSON.parse(localStorage.getItem('custom_pts') || '[]'); } catch(e){}
  return custom;
}

function getFavs(){
  try { return JSON.parse(localStorage.getItem('favorite_marks') || '[]'); } catch(e){ return []; }
}

function saveFavs(arr){
  localStorage.setItem('favorite_marks', JSON.stringify(arr));
}

function removeFav(name){
  saveFavs(getFavs().filter(function(f){ return f !== name; }));
  render();
}

// ─── NAVIGATION ───────────────────────────────────────────
function goToMap(lat, lng){
  window.location.href = './index.html?lat=' + lat + '&lng=' + lng;
}

// ─── BADGE BUILDER ────────────────────────────────────────
function badgeHtml(status){
  if(status === 'новая')    return '<span class="badge badge-red">🔴 Новая</span>';
  if(status === 'в работе') return '<span class="badge badge-orange">🟠 В работе</span>';
  return '<span class="badge badge-green">✅ Выполнена</span>';
}

function starsHtml(n){
  var s = '<span class="stars">';
  for(var i = 1; i <= 5; i++) s += '<span class="'+(i<=n?'':'off')+'">★</span>';
  return s + '</span>';
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── RENDER ───────────────────────────────────────────────
function render(){
  var points  = getAllPoints();
  var favs    = getFavs();
  var search  = document.getElementById('searchInput').value.toLowerCase().trim();
  var stFilter= document.getElementById('filterStatus').value;
  var dfFilter= document.getElementById('filterDiff').value;
  var list    = document.getElementById('list');
  var badge   = document.getElementById('count-badge');

  // Filter favs to points that exist AND pass filters
  var filtered = favs.reduce(function(acc, name){
    var p = points.find(function(pt){ return pt.name === name; });
    if(!p) return acc;
    if(search && p.name.toLowerCase().indexOf(search) === -1 && p.desc.toLowerCase().indexOf(search) === -1) return acc;
    if(stFilter !== 'all' && p.status !== stFilter) return acc;
    if(dfFilter !== 'all' && String(p.diff) !== dfFilter) return acc;
    acc.push(p);
    return acc;
  }, []);

  badge.textContent = favs.length + ' ' + plural(favs.length, 'метка', 'метки', 'меток');

  if(!favs.length){
    list.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <span class="empty-icon">⭐</span>
        <div class="empty-title">Нет избранных меток</div>
        <div class="empty-sub">Откройте карту, нажмите на метку и добавьте её в избранное,<br>чтобы быстро находить её здесь.</div>
        <a href="./index.html" class="empty-btn">🗺️ Открыть карту</a>
      </div>`;
    return;
  }

  if(!filtered.length){
    list.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <span class="empty-icon">🔍</span>
        <div class="empty-title">Ничего не найдено</div>
        <div class="empty-sub">Попробуйте изменить фильтры или поисковый запрос.</div>
      </div>`;
    return;
  }

  var html = '';
  filtered.forEach(function(p, idx){
    var delay = (idx * 0.05).toFixed(2) + 's';
    var hasBefore = p.before && p.before.length > 10;
    var hasAfter  = p.after  && p.after.length  > 10;
    var showPhotos = hasBefore || hasAfter;

    html += `
      <div class="card" style="animation-delay:${delay}">
        <div class="card-top">
          <button class="card-fav-star" onclick="removeFav('${escHtml(p.name)}')" title="Убрать из избранного">⭐</button>
          <div class="card-name">${escHtml(p.name)}</div>
          <div class="card-badges">
            ${badgeHtml(p.status)}
            ${p.diff ? '<span class="badge badge-diff">' + starsHtml(p.diff) + '</span>' : ''}
            ${(p.vol || 0) > 0 ? '<span class="badge badge-vol">🙋 ' + (p.vol||0) + ' волонтёров</span>' : ''}
            ${p.public ? '<span class="badge" style="background:#e6f0ff;color:#1a4fa3">🌍 Общая</span>' : ''}
          </div>
          <div class="card-desc">${escHtml(p.desc)}</div>
        </div>

        <div class="card-meta">
          ${p.author ? '<div class="meta-item">👤 ' + escHtml(p.author) + '</div>' : ''}
          <div class="meta-item">📍 ${escHtml(p.lat.toFixed(4))}, ${escHtml(p.lng.toFixed(4))}</div>
          ${p.diff ? '<div class="meta-item">💪 ' + ['','Очень легко','Легко','Средне','Сложно','Очень сложно'][p.diff] + '</div>' : ''}
        </div>

        ${showPhotos ? `
        <div class="card-photos">
          <div class="photo-col">
            <div class="photo-label">До</div>
            ${hasBefore ? '<img class="photo-img" src="'+p.before+'" loading="lazy" alt="До"/>' : '<div class="photo-empty">Нет фото</div>'}
          </div>
          <div class="photo-col">
            <div class="photo-label">После</div>
            ${hasAfter ? '<img class="photo-img" src="'+p.after+'" loading="lazy" alt="После"/>' : '<div class="photo-empty">Не добавлено</div>'}
          </div>
        </div>` : ''}

        <div class="card-actions">
          <button class="btn btn-goto" onclick="goToMap(${p.lat},${p.lng})">📍 Перейти на карте</button>
          <button class="btn btn-remove" onclick="removeFav('${escHtml(p.name)}')">✕ Удалить</button>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

function plural(n, one, few, many){
  var m = Math.abs(n) % 100;
  var m1 = m % 10;
  if(m > 10 && m < 20) return many;
  if(m1 > 1 && m1 < 5) return few;
  if(m1 === 1) return one;
  return many;
}

// ─── INIT ─────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterStatus').addEventListener('change', render);
document.getElementById('filterDiff').addEventListener('change', render);

render();
</script>
</body>
</html>
